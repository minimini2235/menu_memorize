<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴암기</title>
<style>
  :root{
    --bg:#FBF4EC; --card:#FFFFFF; --line:#E8DAC8;
    --ink:#3B2415; --ink-soft:#6B4423; --muted:#9C8770;
    --accent:#2E6B4F; --accent-soft:#E4EFE8;
    --caramel:#C97B3D; --caramel-soft:#FBEADA;
    --bad:#C0392B; --bad-soft:#FBE4E1;
    --good:#2E6B4F; --good-soft:#E4EFE8;
    --shadow:0 1px 2px rgba(59,36,21,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Malgun Gothic",Pretendard,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line); padding:8px 12px 0;
  }
  h1{font-size:16px; margin:2px 4px 8px; color:var(--ink);}

  nav.tabs{display:flex; gap:12px; overflow-x:auto; align-items:flex-start;}
  .taggroup{display:flex; flex-direction:column; gap:3px; flex:none;}
  .taggroup-label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding-left:3px;}
  .taggroup-btns{display:flex; gap:3px;}
  nav.tabs button{
    flex:none; min-width:64px; border:none; background:transparent; color:var(--ink-soft);
    padding:9px 6px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}

  .modebar{display:flex; align-items:center; gap:8px; padding:7px 2px 8px; font-size:11px; color:var(--muted);}
  .seg2{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;}
  .seg2 button{border:none; background:#fff; color:var(--ink-soft); font-size:11px; padding:5px 11px; cursor:pointer;}
  .seg2 button.active{background:var(--ink); color:#fff;}

  main{max-width:900px; width:94%; margin:0 auto; padding:12px 0 80px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);}
  .rule-box{padding:12px 14px; margin-bottom:12px; font-size:12.5px; line-height:1.65; color:var(--ink-soft);}
  .rule-box b{color:var(--ink);}

  .filterbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px;
    padding:6px 11px; font-size:12px; cursor:pointer; user-select:none;
  }
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .chip.pop{border-color:var(--caramel);}
  .chip.pop.on{background:var(--caramel); border-color:var(--caramel);}
  .filtertoggle{font-weight:700;}
  .toolrow{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .toolrow .cnt{font-weight:700; color:var(--ink-soft);}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px;}

  .cat-block{margin-bottom:16px;}
  .cat-head{font-size:14px; font-weight:700; color:var(--ink); margin:0 0 6px 2px; display:flex; align-items:center; gap:6px;}
  .cat-head .n{font-size:11px; color:var(--muted); font-weight:400;}

  .item{border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:7px; overflow:hidden;}
  .item.done{opacity:.5;}
  .item-head{display:flex; align-items:center; gap:6px; padding:10px 10px; cursor:pointer;}
  .item-head .star{font-size:16px; color:var(--line); cursor:pointer; flex:none;}
  .item-head .star.on{color:var(--caramel);}
  .item-head .namewrap{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .item-head .name{font-size:14px; font-weight:600;}
  .item-head .oneliner{font-size:11px; color:var(--muted); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-head .cup{font-size:11px; color:#fff; background:var(--accent); border-radius:6px; padding:2px 6px; flex:none;}
  .item-head .arrow{color:var(--muted); font-size:11px; flex:none;}
  .item-head .iconbtn{
    flex:none; font-size:12px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink-soft); border-radius:7px; padding:4px 7px; cursor:pointer;
  }
  .item-head .donebtn.on{background:var(--good-soft); border-color:var(--good); color:var(--good);}
  .item-body{padding:2px 12px 12px; font-size:12.5px; line-height:1.7; display:none;}
  .item-body.open{display:block;}
  .steps{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 8px;}
  .step{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:3px 8px; font-size:12px;}
  .step[data-i]::before{content:attr(data-i)"."; margin-right:3px; font-weight:700;}
  .step.skip{background:var(--bg); color:var(--muted); opacity:.6; text-decoration:line-through;}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:4px 8px; margin-bottom:3px;}
  .kv b{color:var(--ink-soft); font-weight:700;}
  .sub{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--muted); font-size:11.5px;}
  .memo{margin-top:6px; font-size:11.5px; color:var(--ink-soft); background:var(--accent-soft); border-radius:8px; padding:6px 9px;}

  .qcard{padding:18px 16px; text-align:center;}
  .qcat{font-size:11px; color:var(--muted); margin-bottom:6px;}
  .qname{font-size:20px; font-weight:800; margin:4px 0 2px;}
  .qcup{display:inline-block; font-size:11px; color:#fff; background:var(--accent); border-radius:6px; padding:2px 7px; margin-top:6px;}
  .qprompt{margin-top:10px; font-size:12px; color:var(--muted);}

  .flip-wrap{perspective:1000px; margin-bottom:14px;}
  .flip-card{position:relative; min-height:210px; cursor:pointer;}
  .flip-face{border:1px solid var(--line); border-radius:14px; background:#fff; padding:18px 16px; min-height:210px; display:flex; flex-direction:column; justify-content:center;}
  .flip-face.back{text-align:left; justify-content:flex-start; display:none;}
  .flip-face.back.show{display:flex;}
  .flip-face.front.hide{display:none;}
  .flip-hint{position:absolute; bottom:10px; right:14px; font-size:11px; color:var(--muted);}

  .btnrow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .btn{flex:1; border:none; border-radius:10px; padding:12px 8px; font-size:13px; font-weight:700; cursor:pointer; min-width:120px;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--ink-soft);}
  .btn.warn{background:var(--bad-soft); color:var(--bad); border:1px solid #f0c9c3;}
  .btn.good{background:var(--good-soft); color:var(--good); border:1px solid #bfe0cd;}
  .btn:disabled{opacity:.4; cursor:default;}

  .mc-mode{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .mc-mode button{flex:1 1 30%; padding:8px 4px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .mc-mode button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .options{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .opt{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px 12px;
    text-align:left; font-size:13px; line-height:1.6; cursor:pointer; color:var(--ink);
  }
  .opt b{display:block; font-size:14px; margin-bottom:2px;}
  .opt.correct{background:var(--good-soft); border-color:var(--good);}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad);}
  .opt.disabled{opacity:.45; pointer-events:none;}
  .score{font-size:12px; color:var(--muted); text-align:right; margin-bottom:6px;}
  .drillmsg{border-radius:9px; padding:9px 11px; font-size:12px; margin-top:10px; line-height:1.6; font-weight:600;}
  .drillmsg.ok{background:var(--good-soft); color:var(--good);}
  .drillmsg.bad{background:var(--bad-soft); color:var(--bad);}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 10px;}
  footer.credit{text-align:center; color:var(--muted); font-size:11px; padding:20px 0 4px;}

  /* editor */
  .editbox{border:2px solid var(--accent); border-radius:12px; background:#fff; padding:14px; margin-bottom:14px;}
  .editbox h3{margin:0 0 10px; font-size:14px; color:var(--accent);}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px; font-weight:700;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; background:var(--bg); color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .steprow{border:1px solid var(--line); border-radius:9px; padding:8px; margin-bottom:8px; background:var(--bg);}
  .steprow-top{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .steprow-top input{flex:1;}
  .pairrow{display:flex; gap:6px; margin-bottom:4px; align-items:center;}
  .pairrow input{flex:1; padding:6px 8px; font-size:12px;}
  .tinybtn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; color:var(--ink-soft); flex:none;}
  .tinybtn.danger{color:var(--bad); border-color:#f0c9c3;}
  .skiptoggle{border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:11px; cursor:pointer; flex:none;}
  .skiptoggle.included{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .skiptoggle.skipped{background:var(--bg); color:var(--muted);}
</style>
</head>
<body>

<header>
  <h1>메뉴암기</h1>
  <nav class="tabs">
    <div class="taggroup">
      <span class="taggroup-label">공부</span>
      <div class="taggroup-btns">
        <button data-tab="list" class="active">📋 목록</button>
        <button data-tab="card">🎴 카드</button>
      </div>
    </div>
    <div class="taggroup">
      <span class="taggroup-label">문제</span>
      <div class="taggroup-btns">
        <button data-tab="drill">🎯 문제풀이</button>
        <button data-tab="speed">⚡ 스피드</button>
      </div>
    </div>
  </nav>
  <div class="modebar">
    <span>제조과정</span>
    <div class="seg2" id="stepModeSeg">
      <button data-stepmode="full" class="active">전체보기</button>
      <button data-stepmode="summary">요약보기</button>
    </div>
  </div>
</header>

<main>

  <!-- LIST -->
  <div class="panel active" id="panel-list">
    <div id="itemFormHost"></div>

    <div class="filterbar" id="catFilterBar"></div>
    <div class="filterbar">
      <span class="chip" id="fltUnstudied">🙈 안 외운 것만</span>
      <span class="chip pop" id="fltPopular">⭐ 인기메뉴만</span>
      <button class="linkbtn" id="selAll">전체선택</button>
      <button class="linkbtn" id="selNone">전체해제</button>
    </div>
    <div class="toolrow">
      <span>표시중 <span class="cnt" id="listCount">0</span>개 · 외운 것 <span class="cnt" id="doneCount">0</span>개</span>
      <button class="linkbtn" id="resetDone">전체 다시 학습으로</button>
      <button class="btn primary" style="flex:none; padding:8px 14px;" id="addItemBtn">➕ 메뉴 추가</button>
    </div>

    <div id="listRoot"></div>
  </div>

  <!-- CARD -->
  <div class="panel" id="panel-card">
    <div class="filterbar" id="cardFilterInfo"></div>
    <div class="score" id="cardProgress"></div>
    <div class="flip-wrap">
      <div class="flip-card card" id="flipCard">
        <div class="flip-face front" id="cardFront">
          <div class="qcard">
            <div class="qcat" id="cardCat">-</div>
            <div class="qname" id="cardName">-</div>
            <div class="qcup" id="cardCup"></div>
          </div>
        </div>
        <div class="flip-face back" id="cardBack"></div>
        <div class="flip-hint">탭하면 뒤집힙니다 🔄</div>
      </div>
    </div>
    <div class="btnrow">
      <button class="btn good" id="cardRight">✅ 외웠음</button>
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="cardShuffle">🔀 섞기</button>
      <button class="btn ghost" id="cardNext">다음 ▶</button>
    </div>
  </div>

  <!-- DRILL -->
  <div class="panel" id="panel-drill">
    <div class="filterbar"><button class="chip filtertoggle">✅ 목록 필터 적용중</button></div>
    <div class="mc-mode" id="drillQBar">
      <button class="active" data-qtype="ingredient">🧪 재료 맞추기</button>
      <button data-qtype="amount">⚖️ 양 맞추기</button>
      <button data-qtype="order">🧭 과정 맞추기</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:2px 0 10px;">
    <div class="mc-mode" id="drillRunBar">
      <button class="active" data-drillrun="mc">🔘 연습문제</button>
      <button data-drillrun="one">하나만 드릴</button>
      <button data-drillrun="all">전체 드릴</button>
    </div>
    <div class="score" id="drillStatus"></div>
    <div class="card qcard" id="drillQuestionBox">
      <div id="drillQuestion"></div>
    </div>
    <div class="options" id="drillOptions"></div>
    <div class="drillmsg" id="drillMsg" style="display:none;"></div>
    <div class="btnrow">
      <button class="btn primary" id="drillNext" style="display:none;">다음 메뉴로 ▶</button>
    </div>
  </div>

  <!-- SPEED -->
  <div class="panel" id="panel-speed">
    <div class="filterbar"><button class="chip filtertoggle">✅ 목록 필터 적용중</button></div>
    <div class="score" id="speedScore">0 / 0</div>
    <div class="card qcard" id="speedQuestionBox">
      <div id="speedQuestion"></div>
    </div>
    <div class="options" id="speedOptions"></div>
    <div class="btnrow">
      <button class="btn primary" id="speedNext">다음 문제 ▶</button>
    </div>
  </div>

</main>
<footer class="credit">데모 v3 · 메뉴 직접 추가/수정 가능</footer>

// ---- paren-aware tokenizer: splits only on spaces OUTSIDE parentheses ----
function splitSteps(str){
  const result=[]; let depth=0, cur='';
  for(const ch of String(str)){
    if(ch==='('){ depth++; cur+=ch; }
    else if(ch===')'){ depth=Math.max(0,depth-1); cur+=ch; }
    else if(ch===' ' && depth===0){ if(cur){ result.push(cur); cur=''; } }
    else { cur+=ch; }
  }
  if(cur) result.push(cur);
  return result;
}
function fieldKindForToken(tok){
  if(tok.includes('액상')) return 'liquid';
  if(tok.includes('재료') || tok.includes('베이스')) return 'ingredient';
  if(tok.includes('토핑')) return 'topping';
  return null;
}
function parseChunkToPair(chunk){
  chunk = chunk.trim();
  if(!chunk || chunk==='x' || chunk==='X' || chunk==='자동') return null;
  const m = chunk.match(/^(.*?)(\d+(?:\.\d+)?)$/);
  if(m && m[1].trim()) return {ingredient:m[1].trim(), amount:m[2]};
  return {ingredient:chunk, amount:''};
}
function parseFieldToGroups(field){
  if(!field) return [];
  return field.split('/').map(g=> splitSteps(g.trim()).map(parseChunkToPair).filter(Boolean));
}
// one-time migration: legacy order/liquid/ingredient/topping strings -> structured steps[{label,skip,pairs}]
function deriveStepsFromLegacy(it){
  const toks = splitSteps(it.order);
  const groupsByKind = { liquid: parseFieldToGroups(it.liquid), ingredient: parseFieldToGroups(it.ingredient), topping: parseFieldToGroups(it.topping) };
  const occur = {liquid:0, ingredient:0, topping:0};
  return toks.map(tok=>{
    const kind = fieldKindForToken(tok);
    let pairs=[];
    if(kind){
      const groups = groupsByKind[kind];
      const idx = occur[kind]++;
      pairs = (idx<groups.length ? groups[idx] : groups[groups.length-1]) || [];
    }
    return { label: tok, skip: (tok==='추출' || tok==='스팀'), pairs };
  });
}

function loadSet(key){ try{ return new Set(JSON.parse(localStorage.getItem(key)||'[]')); }catch(e){ return new Set(); } }
function saveSet(key, set){ try{ localStorage.setItem(key, JSON.stringify([...set])); }catch(e){} }
function loadJSON(key, fb){ try{ const v=JSON.parse(localStorage.getItem(key)); return v==null?fb:v; }catch(e){ return fb; } }
function saveJSON(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

]);

let ALL_ITEMS = [];
function rebuildAllItems(){
  ALL_ITEMS = [];
  CATEGORIES.forEach(cat=>{
    cat.items.forEach(it=>{
      if(deletedIds.has(it.id)) return;
      if(!it.steps){ it.steps = deriveStepsFromLegacy(it); it.memo = it.tip||''; }
      const ov = overrides[it.id];
      const merged = ov ? Object.assign({}, it, ov) : it;
      merged.id = it.id; merged.catLabel = (CATEGORIES.find(c=>c.key===merged.catKey)||cat).label;
      ALL_ITEMS.push(merged);
    });
  });
  customItems.forEach(ci=>{
    if(deletedIds.has(ci.id)) return;
    const cat = CATEGORIES.find(c=>c.key===ci.catKey) || CATEGORIES.find(c=>c.key==='custom');
    ALL_ITEMS.push(Object.assign({}, ci, {catLabel: cat.label}));
  });
}
rebuildAllItems();

function isPopular(it){ return favOverride.hasOwnProperty(it.id) ? favOverride[it.id] : DEFAULT_POPULAR.has(it.id); }
function isStudied(it){ return studied.has(it.id); }

let showUnstudiedOnly=false, showPopularOnly=false;
let summaryMode=false;      // 요약보기: steps flagged skip=true are hidden/ignored everywhere
let filterOn=true;          // 문제 탭(객관식/드릴/스피드)에서 목록 필터를 적용할지

function currentPool(){
  return ALL_ITEMS.filter(it=>{
    if(!selectedCats.has(it.catKey)) return false;
    if(showUnstudiedOnly && isStudied(it)) return false;
    if(showPopularOnly && !isPopular(it)) return false;
    return true;
  });
}
function quizPool(){ return filterOn ? currentPool() : ALL_ITEMS; }

function visibleSteps(item){ return item.steps.filter(s=> !(summaryMode && s.skip)); }
function allPairs(item){
  const out=[];
  visibleSteps(item).forEach((step,si)=>{ step.pairs.forEach((pair,pi)=>{ out.push({step, pair, si, pi}); }); });
  return out;
}
function amountPairs(item){ return allPairs(item).filter(p=>p.pair.amount!==''); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stepsHtml(item){
  return visibleSteps(item).map((s,i)=>`<span class="step" data-i="${i+1}">${escapeHtml(s.label)}</span>`).join('');
}
function oneLiner(it){
  const vs = visibleSteps(it);
  const labels = vs.map(s=>s.label);
  const short = labels.length>4 ? labels.slice(0,4).join(' → ')+' …' : labels.join(' → ');
  const firstPair = allPairs(it)[0];
  return short + (firstPair ? ' · '+firstPair.pair.ingredient+(firstPair.pair.amount?firstPair.pair.amount:'') : '');
}

function renderList(){
  const root=document.getElementById('listRoot');
  root.innerHTML='';
  const pool = currentPool();
  let shown=0, doneN=0;
  ALL_ITEMS.forEach(it=>{ if(isStudied(it)) doneN++; });

  CATEGORIES.forEach(cat=>{
    if(!selectedCats.has(cat.key)) return;
    const items = pool.filter(it=>it.catKey===cat.key);
    if(items.length===0) return;
    shown += items.length;
    const block=document.createElement('div');
    block.className='cat-block';
    block.innerHTML = `<div class="cat-head">${cat.icon} ${cat.label} <span class="n">(${items.length})</span></div>`;

    items.forEach(it=>{
      const done=isStudied(it), pop=isPopular(it);
      const el=document.createElement('div');
      el.className='item'+(done?' done':'');
      el.innerHTML = `
        <div class="item-head">
          <span class="star ${pop?'on':''}" title="인기메뉴 표시">★</span>
          <div class="namewrap">
            <span class="name">${escapeHtml(it.name)}</span>
            <span class="oneliner">${escapeHtml(oneLiner(it))}</span>
          </div>
          ${it.cup?`<span class="cup">${it.cup}oz</span>`:''}
          <button class="iconbtn editbtn">✏️</button>
          <button class="iconbtn donebtn ${done?'on':''}">${done?'✓':'완료'}</button>
          <span class="arrow">▼</span>
        </div>
        <div class="item-body">
          <div class="steps">${visibleSteps(it).map((s,i)=>`<span class="step" data-i="${i+1}">${escapeHtml(s.label)}</span>`).join('')}</div>
          ${allPairs(it).map(p=>`<div class="kv"><b>${escapeHtml(p.step.label)}</b><span>${escapeHtml(p.pair.ingredient)}${p.pair.amount?(' '+p.pair.amount):''}</span></div>`).join('')}
          ${it.memo?`<div class="memo">📝 ${escapeHtml(it.memo)}</div>`:''}
        </div>`;
      el.querySelector('.star').addEventListener('click', (e)=>{ e.stopPropagation(); favOverride[it.id]=!isPopular(it); saveFav(); renderList(); });
      el.querySelector('.donebtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(studied.has(it.id)) studied.delete(it.id); else studied.add(it.id); saveSet(LS_STUDIED, studied); renderList(); });
      el.querySelector('.editbtn').addEventListener('click', (e)=>{ e.stopPropagation(); openItemForm(it); });
      el.querySelector('.item-head').addEventListener('click', (e)=>{
        if(e.target.closest('.editbtn')||e.target.closest('.donebtn')||e.target.closest('.star')) return;
        el.querySelector('.item-body').classList.toggle('open');
        el.querySelector('.arrow').textContent = el.querySelector('.item-body').classList.contains('open') ? '▲' : '▼';
      });
      block.appendChild(el);
    });
    root.appendChild(block);
  });
  if(shown===0) root.innerHTML = '<div class="empty">조건에 맞는 메뉴가 없어요.<br>카테고리나 필터를 조정해보세요.</div>';
  document.getElementById('listCount').textContent = shown;
  document.getElementById('doneCount').textContent = doneN;
}

      <button type="button" class="tinybtn">➕ 재료/양 추가</button>`;
    const labelInput = row.querySelector('.steprow-top input');
    labelInput.addEventListener('input', ()=>{ step.label=labelInput.value; });
    row.querySelector('.skiptoggle').addEventListener('click', (e)=>{ step.skip=!step.skip; e.target.textContent = step.skip?'요약에서 생략':'요약에도 포함'; e.target.className='skiptoggle '+(step.skip?'skipped':'included'); });
    row.querySelector('.tinybtn.danger').addEventListener('click', ()=>{ draftSteps.splice(si,1); renderStepRows(); });
    row.querySelector(':scope > .tinybtn:not(.danger)').addEventListener('click', ()=>{ step.pairs.push({ingredient:'',amount:''}); renderPairRows(step, row.querySelector('.pairsHost')); });
    renderPairRows(step, row.querySelector('.pairsHost'));
    root.appendChild(row);
  });
}
function renderPairRows(step, host){
  host.innerHTML='';
  step.pairs.forEach((pair, pi)=>{
    const pr=document.createElement('div');
    pr.className='pairrow';
    pr.innerHTML = `<input placeholder="재료명" value="${escapeHtml(pair.ingredient)}"><input placeholder="양(선택)" value="${escapeHtml(pair.amount)}" style="max-width:90px;"><button type="button" class="tinybtn danger">✕</button>`;
    const [ing,amt]=pr.querySelectorAll('input');
    ing.addEventListener('input', ()=>{ pair.ingredient=ing.value; });
    amt.addEventListener('input', ()=>{ pair.amount=amt.value; });
    pr.querySelector('.tinybtn').addEventListener('click', ()=>{ step.pairs.splice(pi,1); renderPairRows(step, host); });
    host.appendChild(pr);
  });
}

function showCardFace(){

document.getElementById('cardShuffle').addEventListener('click', ()=>{

// ======================= shared quiz engine (문제 3유형: ingredient/amount/order) =======================
function pickUnique(correctVal, candidates, n){
  const seen=new Set(); const out=[];
  for(const c of candidates){ if(c===correctVal||c===''||seen.has(c)) continue; seen.add(c); out.push(c); if(out.length>=n) break; }
  return out;
}
function poolForItem(item){
  const same = ALL_ITEMS.filter(x=>x.id!==item.id && x.catKey===item.catKey);
  return same.length ? same : ALL_ITEMS.filter(x=>x.id!==item.id);
}
function ingredientDistractors(item, correct, n){
  let vals=[]; poolForItem(item).forEach(x=>allPairs(x).forEach(p=>vals.push(p.pair.ingredient)));
  let out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n);
  if(out.length<n){ vals=[]; ALL_ITEMS.forEach(x=>{ if(x.id!==item.id) allPairs(x).forEach(p=>vals.push(p.pair.ingredient)); }); out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n); }
  return out;
}
function amountDistractors(item, correct, n){
  let vals=[]; poolForItem(item).forEach(x=>amountPairs(x).forEach(p=>vals.push(p.pair.amount)));
  let out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n);
  if(out.length<n){ vals=[]; ALL_ITEMS.forEach(x=>{ if(x.id!==item.id) amountPairs(x).forEach(p=>vals.push(p.pair.amount)); }); out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n); }
  return out;
}
function orderDistractors(item, correct, n){
  let vals=[]; poolForItem(item).forEach(x=>visibleSteps(x).forEach(s=>vals.push(s.label)));
  let out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n);
  if(out.length<n){ vals=[]; ALL_ITEMS.forEach(x=>{ if(x.id!==item.id) visibleSteps(x).forEach(s=>vals.push(s.label)); }); out = pickUnique(correct, [...new Set(vals)].sort(()=>Math.random()-0.5), n); }
  return out;
}
function unitsFor(item, qType){
  if(qType==='order') return visibleSteps(item).map((s,i)=>({kind:'order', si:i, correct:s.label}));
  if(qType==='amount') return amountPairs(item).map(p=>({kind:'amount', si:p.si, pi:p.pi, correct:p.pair.amount}));
  return allPairs(item).map(p=>({kind:'ingredient', si:p.si, pi:p.pi, correct:p.pair.ingredient}));
}
function distractorsFor(item, qType, correct){
  if(qType==='order') return orderDistractors(item, correct, 3);
  if(qType==='amount') return amountDistractors(item, correct, 3);
  return ingredientDistractors(item, correct, 3);
}
function promptFor(qType){
  if(qType==='order') return '다음 단계는?';
  if(qType==='amount') return '이 재료의 양은?';
  return '이 자리의 재료는?';
}
// renders the item's full step/pair structure, masking exactly one unit (fill-in-the-blank).
// solvedUpTo==='all' -> everything except the current unit is revealed (객관식/스피드: one blank at a time).
// solvedUpTo is a number -> only units before that index are revealed, later ones stay hidden (드릴: builds up sequentially).
function isUnitSolved(idx, currentIdx, solvedUpTo){
  if(idx===currentIdx) return false;
  return solvedUpTo==='all' ? true : idx < solvedUpTo;
}
// top row: step labels only ("과정만 표시") — for order mode this row IS the quiz (masked per solvedUpTo);
// for ingredient/amount modes it's always fully revealed context, numbered 1./2./3... via data-i (never a bare "?" without its number).
function renderStepsRow(item, currentIdx, solvedUpTo, resultMark){
  const vs = visibleSteps(item);
  return vs.map((step,i)=>{
    const num = i+1;
    if(currentIdx==null) return `<span class="step" data-i="${num}">${escapeHtml(step.label)}</span>`;
    const isCurrent = i===currentIdx;
    const solved = isUnitSolved(i, currentIdx, solvedUpTo);
    if(isCurrent && resultMark==='ok') return `<span class="step" data-i="${num}" style="background:var(--good-soft);color:var(--good);">${escapeHtml(step.label)}</span>`;
    if(isCurrent && resultMark==='bad') return `<span class="step" data-i="${num}" style="background:var(--bad-soft);color:var(--bad);">정답: ${escapeHtml(step.label)}</span>`;
    if(solved) return `<span class="step" data-i="${num}">${escapeHtml(step.label)}</span>`;
    if(isCurrent) return `<span class="step" data-i="${num}" style="background:var(--caramel-soft);color:#8a4d19;">?</span>`;
    return `<span class="step" data-i="${num}" style="opacity:.35;">?</span>`;
  }).join('');
}
// below the steps row, like the 목록 item body: "단계명 — 재료 양" rows, with the tested slot's
// ingredient (재료맞추기) or amount (양맞추기) replaced by ??? until answered
function renderPairKvRows(item, qType, currentUnitIdx, solvedUpTo, resultMark){
  const vs = visibleSteps(item);
  let pairCounter=0, amtCounter=0;
  const rows=[];
  vs.forEach(step=>{
    step.pairs.forEach(pair=>{
      if(qType==='ingredient'){
        const myIdx=pairCounter++;
        const isCurrent = myIdx===currentUnitIdx;
        const solved = isUnitSolved(myIdx, currentUnitIdx, solvedUpTo);
        let val;
        if(isCurrent && resultMark==='ok') val = `<b style="color:var(--good);">${escapeHtml(pair.ingredient)}${pair.amount?(' '+pair.amount):''}</b>`;
        else if(isCurrent && resultMark==='bad') val = `<b style="color:var(--bad);">정답: ${escapeHtml(pair.ingredient)}${pair.amount?(' '+pair.amount):''}</b>`;
        else if(solved) val = `${escapeHtml(pair.ingredient)}${pair.amount?(' '+pair.amount):''}`;
        else val = `<span style="color:var(--caramel);font-weight:700;">???</span>`;
        rows.push(`<div class="kv"><b>${escapeHtml(step.label)}</b><span>${val}</span></div>`);
      } else if(qType==='amount'){
        if(pair.amount===''){ rows.push(`<div class="kv"><b>${escapeHtml(step.label)}</b><span>${escapeHtml(pair.ingredient)}</span></div>`); return; }
        const myIdx=amtCounter++;
        const isCurrent = myIdx===currentUnitIdx;
        const solved = isUnitSolved(myIdx, currentUnitIdx, solvedUpTo);
        let val;
        if(isCurrent && resultMark==='ok') val = `${escapeHtml(pair.ingredient)} <b style="color:var(--good);">${pair.amount}</b>`;
        else if(isCurrent && resultMark==='bad') val = `${escapeHtml(pair.ingredient)} <b style="color:var(--bad);">정답: ${pair.amount}</b>`;
        else if(solved) val = `${escapeHtml(pair.ingredient)} ${pair.amount}`;
        else val = `${escapeHtml(pair.ingredient)} <span style="color:var(--caramel);font-weight:700;">???</span>`;
        rows.push(`<div class="kv"><b>${escapeHtml(step.label)}</b><span>${val}</span></div>`);
      }
    });
  });
  return rows.join('');
}
// combines the two: order mode masks the steps row itself; ingredient/amount mode shows the full
// process (unmasked) plus the kv rows below with exactly one ingredient/amount slot masked
function renderQuestionBlock(item, qType, currentUnitIdx, units, solvedUpTo, resultMark){
  if(qType==='order'){
    return `<div class="steps" style="justify-content:center;margin-top:10px;">${renderStepsRow(item, currentUnitIdx, solvedUpTo, resultMark)}</div>`;
  }
  const stepsRow = renderStepsRow(item, null, solvedUpTo, null);
  const kv = renderPairKvRows(item, qType, currentUnitIdx, solvedUpTo, resultMark);
  return `<div class="steps" style="justify-content:center;margin-top:10px;">${stepsRow}</div><div style="margin-top:8px;text-align:left;">${kv}</div>`;
}

// ======================= 드릴 (객관식/하나만/전체) =======================
let drillQType='ingredient', drillRunMode='mc', drillScore={c:0,t:0};
let drillQueue=[], drillQueueIdx=0, drillItem=null, drillUnits=[], drillUnitIdx=0;
let drillPhase='question', drillLastCorrect=false, drillPendingFn=null, drillAutoTimer=null;
function clearDrillAutoTimer(){ if(drillAutoTimer){ clearTimeout(drillAutoTimer); drillAutoTimer=null; } }
document.querySelectorAll('#drillQBar button').forEach(b=>{
  b.addEventListener('click', ()=>{ document.querySelectorAll('#drillQBar button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); drillQType=b.dataset.qtype; drillScore={c:0,t:0}; startDrillSession(); });
});
document.querySelectorAll('#drillRunBar button').forEach(b=>{
  b.addEventListener('click', ()=>{ document.querySelectorAll('#drillRunBar button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); drillRunMode=b.dataset.drillrun; drillScore={c:0,t:0}; startDrillSession(); });
});
function loadDrillItem(item){
  drillItem=item; drillUnits=unitsFor(item, drillQType); drillUnitIdx=0;
  drillPhase='question'; drillPendingFn=null;
  renderDrillQuestion();
}
// 연습문제/하나만 드릴 모두 "메뉴 하나를 골라 처음부터 순서대로" 진행한다 — 차이는 오답 처리뿐(answerDrill에서 분기)
function startDrillSession(){
  clearDrillAutoTimer();
  const pool = quizPool().filter(it=>unitsFor(it, drillQType).length>0);
  document.getElementById('drillMsg').style.display='none';
  if(pool.length===0){
    drillItem=null;
    document.getElementById('drillQuestion').innerHTML = '<div class="empty">이 유형으로 낼 수 있는 메뉴가 없어요.<br>필터나 유형을 조정해보세요.</div>';
    document.getElementById('drillOptions').innerHTML=''; document.getElementById('drillStatus').textContent='';
    const nb=document.getElementById('drillNext'); nb.disabled=true; nb.style.display='none';
    return;
  }
  if(drillRunMode==='all'){ drillQueue = pool.slice().sort(()=>Math.random()-0.5); drillQueueIdx=0; loadDrillItem(drillQueue[0]); }
  else loadDrillItem(pool[Math.floor(Math.random()*pool.length)]); // 'mc' and 'one' both just start with a fresh random single item
}
function drillEnsure(){ drillItem ? renderDrillQuestion() : startDrillSession(); }
function drillHeader(){
  const it=drillItem;
  const resultMark = drillPhase==='result' ? (drillLastCorrect?'ok':'bad') : null;
  const block = renderQuestionBlock(it, drillQType, drillUnitIdx, drillUnits, drillUnitIdx, resultMark);
  let prompt;
  if(drillPhase==='result') prompt = drillLastCorrect ? '정답 확인!' : (drillRunMode==='mc' ? '오답 확인 — 다음 단계로 계속 진행됩니다' : '오답 확인 — 처음으로 리셋됩니다');
  else prompt = promptFor(drillQType);
  const scoreLine = drillRunMode==='mc' ? `<div class="score" style="margin:0 0 4px;">${drillScore.c} / ${drillScore.t}</div>` : '';
  return `${scoreLine}<div class="qname">${escapeHtml(it.name)}</div><div class="qcup">${it.cup}oz</div>${block}<div class="qprompt">${prompt}</div>`;
}
function renderDrillQuestion(){
  clearDrillAutoTimer();
  drillPhase='question'; drillPendingFn=null;
  document.getElementById('drillMsg').style.display='none';
  const nb=document.getElementById('drillNext'); nb.style.display='none'; nb.disabled=true;
  if(!drillItem) return;
  const posText = drillRunMode==='all' ? ` · ${drillQueueIdx+1}/${drillQueue.length}번째 메뉴` : '';
  document.getElementById('drillStatus').textContent = `${drillItem.catLabel}${posText}`;
  document.getElementById('drillQuestion').innerHTML = drillHeader();
  const unit = drillUnits[drillUnitIdx];
  const distractors = distractorsFor(drillItem, drillQType, unit.correct);
  const optRoot=document.getElementById('drillOptions'); optRoot.innerHTML='';
  [unit.correct, ...distractors].sort(()=>Math.random()-0.5).forEach(val=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.val=val; b.textContent=val;
    b.addEventListener('click', ()=>answerDrill(b, val, unit.correct));
    optRoot.appendChild(b);
  });
}
function advanceAfterClear(){
  if(drillRunMode==='all'){
    drillQueueIdx++;
    if(drillQueueIdx>=drillQueue.length) startDrillSession();
    else loadDrillItem(drillQueue[drillQueueIdx]);
  } else {
    startDrillSession(); // 'mc' and 'one' both just move on to a fresh random single item
  }
}
function runDrillPending(){ if(drillPendingFn){ const fn=drillPendingFn; drillPendingFn=null; fn(); } }
function answerDrill(btn, value, correctVal){
  clearDrillAutoTimer();
  const opts=[...document.querySelectorAll('#drillOptions .opt')]; opts.forEach(o=>o.classList.add('disabled'));
  drillPhase='result'; drillLastCorrect=(value===correctVal);
  const msgEl=document.getElementById('drillMsg'); msgEl.style.display='block';
  const nextBtn=document.getElementById('drillNext');
  if(drillRunMode==='mc') drillScore.t++;

  if(drillLastCorrect){
    btn.classList.add('correct');
    if(drillRunMode==='mc') drillScore.c++;
    const clearing = (drillUnitIdx+1>=drillUnits.length);
    msgEl.className='drillmsg ok';
    msgEl.textContent = clearing ? `🎉 "${drillItem.name}" 클리어! 다음 메뉴로 넘어가려면 아래 버튼을 눌러주세요.` : '✅ 정답! 잠시 후 다음 단계로 넘어갑니다…';
    drillPendingFn = ()=>{ drillUnitIdx++; if(drillUnitIdx>=drillUnits.length) advanceAfterClear(); else renderDrillQuestion(); };
    if(clearing){ nextBtn.style.display=''; nextBtn.disabled=false; }
    else { nextBtn.style.display='none'; drillAutoTimer=setTimeout(runDrillPending, 700); }
  } else {
    btn.classList.add('wrong');
    const cb=opts.find(o=>o.dataset.val===correctVal); if(cb) cb.classList.add('correct');
    msgEl.className='drillmsg bad';
    if(drillRunMode==='mc'){
      // 연습문제: 틀려도 리셋 없이 정답만 확인하고 계속 다음 단계로 진행
      const clearing = (drillUnitIdx+1>=drillUnits.length);
      msgEl.textContent = clearing ? `❌ 오답! 정답을 확인했어요. "${drillItem.name}" 다음 메뉴로 넘어가려면 아래 버튼을 눌러주세요.` : '❌ 오답! 정답을 확인하고 다음 단계로 넘어갑니다…';
      drillPendingFn = ()=>{ drillUnitIdx++; if(drillUnitIdx>=drillUnits.length) advanceAfterClear(); else renderDrillQuestion(); };
      if(clearing){ nextBtn.style.display=''; nextBtn.disabled=false; }
      else { nextBtn.style.display='none'; drillAutoTimer=setTimeout(runDrillPending, 1200); }
    } else {
      msgEl.textContent = drillRunMode==='all' ? '❌ 틀렸어요! 전체 드릴 1번째 메뉴부터 다시 시작합니다…' : `❌ 틀렸어요! "${drillItem.name}" 1번 문제부터 다시 시작합니다…`;
      drillPendingFn = ()=>{ if(drillRunMode==='all'){ drillQueueIdx=0; loadDrillItem(drillQueue[0]); } else loadDrillItem(drillItem); };
      nextBtn.style.display='none'; drillAutoTimer=setTimeout(runDrillPending, 1400);
    }
  }
  document.getElementById('drillQuestion').innerHTML = drillHeader();
}
document.getElementById('drillNext').addEventListener('click', runDrillPending);

// ======================= 스피드 (메뉴당 질문 1개, 나머지는 다 채워진 상태) =======================
let speedScore={c:0,t:0}, speedCurrent=null;
const QTYPES=['ingredient','amount','order'];
function newSpeedQuestion(){
  const pool=quizPool();
  if(pool.length===0){ document.getElementById('speedQuestion').innerHTML='<div class="empty">조건에 맞는 메뉴가 없어요.</div>'; document.getElementById('speedOptions').innerHTML=''; return; }
  let item, qType, units, tries=0;
  do{
    item = pool[Math.floor(Math.random()*pool.length)];
    qType = QTYPES[Math.floor(Math.random()*QTYPES.length)];
    units = unitsFor(item, qType);
    tries++;
  } while(units.length===0 && tries<15);
  if(units.length===0){ document.getElementById('speedQuestion').innerHTML='<div class="empty">질문을 만들 수 없어요. 다음 문제를 눌러보세요.</div>'; document.getElementById('speedOptions').innerHTML=''; return; }
  const unitIdx = Math.floor(Math.random()*units.length);
  const unit = units[unitIdx];
  speedCurrent = {item, qType, unit};
  const block = renderQuestionBlock(item, qType, unitIdx, units, 'all', null);
  document.getElementById('speedQuestion').innerHTML = `
    <div class="qcat">${item.catLabel}${isPopular(item)?' · ⭐인기':''}</div>
    <div class="qname">${escapeHtml(item.name)}</div>${block}
    <div class="qprompt">${promptFor(qType)}</div>`;
  const distractors = distractorsFor(item, qType, unit.correct);
  const optRoot=document.getElementById('speedOptions'); optRoot.innerHTML='';
  [unit.correct, ...distractors].sort(()=>Math.random()-0.5).forEach(val=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.val=val; b.textContent=val;
    b.addEventListener('click', ()=>answerSpeed(b, val));
    optRoot.appendChild(b);
  });
  updateSpeedScore();
}
function updateSpeedScore(){ document.getElementById('speedScore').textContent = `${speedScore.c} / ${speedScore.t}`; }
function answerSpeed(btn, val){
  const opts=[...document.querySelectorAll('#speedOptions .opt')]; opts.forEach(o=>o.classList.add('disabled'));
  speedScore.t++;
  if(val===speedCurrent.unit.correct){ btn.classList.add('correct'); speedScore.c++; }
  else { btn.classList.add('wrong'); const cb=opts.find(o=>o.dataset.val===speedCurrent.unit.correct); if(cb) cb.classList.add('correct'); }
  updateSpeedScore();
}
document.getElementById('speedNext').addEventListener('click', newSpeedQuestion);
