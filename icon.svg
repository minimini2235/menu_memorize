<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 은은한 노란빛 배경 -->
  <rect width="512" height="512" rx="96" fill="#FBE8A6"/>

  <!-- 수평 종이 메모 (조금 더 크게, 오른쪽 아래 모서리가 삼각형으로 단순하게 접힌 모습) -->
  <path d="M136,106 L376,106 L376,370 L340,406 L136,406 Z" fill="#FFFBF2"/>
  <path d="M376,370 L376,406 L340,406 Z" fill="#E9DAC0"/>

  <!-- 커피잔 그림 (외곽선 없음, 실루엣, 바닥이 둥근 컵 + 몸통과 겹쳐 이어진 손잡이) -->
  <g fill="#C97B3D">
    <!-- 잔: 윗부분은 평평, 아랫부분은 둥글게 -->
    <path d="M196,220 L316,220 L316,266 Q316,320 256,320 Q196,320 196,266 Z"/>
    <!-- 손잡이: 잔 몸통 안쪽까지 겹쳐서 끊김 없이 이어지도록 -->
    <path d="M314,236 Q356,236 356,268 Q356,300 314,300 L314,288 Q340,288 340,268 Q340,248 314,248 Z"/>
  </g>
</svg>
